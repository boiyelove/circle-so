[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "circle-so-cli"
version = "0.1.1"
description = "CLI toolkit for managing Circle.so communities at scale"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Damilola Afolabi" }]
keywords = ["circle", "circle.so", "community", "cli", "management", "circle-api", "circle-admin", "community-management", "member-management", "circle-so", "bulk-operations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: System :: Systems Administration",
    "Environment :: Console",
    "Typing :: Typed",
]
dependencies = [
    "circle-so-python-sdk>=0.1.0",
    "click>=8.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
circle-so = "circle_so.cli:main"

[project.urls]
Homepage = "https://github.com/boiyelove/circle-so"
Repository = "https://github.com/boiyelove/circle-so"
Issues = "https://github.com/boiyelove/circle-so/issues"
Changelog = "https://github.com/boiyelove/circle-so/blob/main/docs/ROADMAP.md"
"SDK" = "https://pypi.org/project/circle-so-python-sdk/"

[tool.hatch.build.targets.wheel]
packages = ["src/circle_so"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
